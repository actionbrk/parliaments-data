# yaml-language-server: $schema=../../schema/chamber.schema.json
name: National Assembly
name_local: Assemblée nationale
seats: 577
vacant: 3
source: datan
updated: 2026-11-04
groups:
  - id: rn
    name: Rassemblement National
    abbreviation: RN
    color: "#313567"
    seats: 121
    parties: [rn]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  # Its members attach for public funding to Ensemble ! (majorité
  # présidentielle), which Renaissance shares with the MoDem and which does
  # not tell them apart: the group is Renaissance's.
  - id: epr
    name: Ensemble pour la République
    abbreviation: EPR
    color: "#7B4591"
    seats: 90
    parties: [re]
    parties_source: https://fr.wikipedia.org/wiki/Groupe_Ensemble_pour_la_R%C3%A9publique

  - id: lfi-nfp
    name: La France insoumise - Nouveau Front Populaire
    abbreviation: LFI-NFP
    color: "#C00D0D"
    seats: 70
    parties: [lfi]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  # Most attach to the Parti socialiste. Place publique sits here
  # through Aurélien Rousseau and Sacha Houlié, who attach to the PS and to
  # Régions et peuples solidaires for funding.
  - id: soc
    name: Socialistes et apparentés
    abbreviation: SOC
    color: "#F5B4CE"
    seats: 68
    parties: [ps, pp]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  - id: dr
    name: Droite Républicaine
    abbreviation: DR
    color: "#8CB0DC"
    seats: 47
    parties: [lr]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  # Most attach to Les Écologistes. Those who attach to the PCF for funding
  # are L'Après's and François Ruffin, not communists.
  - id: ecos
    name: Écologiste et Social
    abbreviation: EcoS
    color: "#77AA79"
    seats: 38
    parties: [eelv]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  # Its members attach to Ensemble ! (majorité présidentielle), as EPR's do:
  # the group is the MoDem's. None attaches to the UDI, whose deputies sit
  # with LIOT and Horizons.
  - id: dem
    name: Les Démocrates
    abbreviation: Dem
    color: "#F07E26"
    seats: 37
    parties: [modem]
    parties_source: https://fr.wikipedia.org/wiki/Groupe_Les_D%C3%A9mocrates

  - id: hor
    name: Horizons & Indépendants
    abbreviation: HOR
    color: "#B5E2F9"
    seats: 35
    parties: [hz]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  # Independents, regionalists and centrists, who attach to a dozen parties
  # (Régions et peuples solidaires 11, the UDI's funding vehicle 6...): none
  # makes up the group.
  - id: liot
    name: Libertés, Indépendants, Outre-mer et Territoires
    abbreviation: LIOT
    color: "#FFD96F"
    seats: 23
    parties: []

  # 9 attach to the PCF, the Gauche républicaine et socialiste's leader
  # Emmanuel Maurel among them; the others to overseas parties.
  - id: gdr
    name: Gauche Démocrate et Républicaine
    abbreviation: GDR
    color: "#830E21"
    seats: 17
    parties: [pcf, grs]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  - id: uddplr
    name: Union des droites pour la République
    abbreviation: UDDPLR
    color: "#3367A7"
    seats: 17
    parties: [udr]
    parties_source: https://data.assemblee-nationale.fr/acteurs/deputes-en-exercice

  - id: ni
    name: Non inscrit
    abbreviation: NI
    color: "#8D949A"
    seats: 11
    parties: []
