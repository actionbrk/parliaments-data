name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate the data
        run: deno task validate

      - name: Test the validator
        run: deno task test

      - name: Check formatting, lint and types
        run: deno task check
